# Local non-printing receiver bootstrap. Setup installs the authoritative settings
# from examples/profile.toml into state_dir/profiles/demo.toml.
listen = "127.0.0.1:8631"
public_url = "ipp://localhost:8631/"
state_dir = "../var/demo"
max_document_bytes = 134217728
max_attribute_bytes = 262144
max_queued_jobs = 128
poll_interval_ms = 1000
backend_timeout_secs = 30

[access]
anonymous_trusted_lan = true
anonymous_owner = "anonymous"
anonymous_clients = ["127.0.0.0/8", "::1/128"]
# To enable authenticated browser administration, provision a private hash with
# ferriprint user password-hash --output /protected/path/admin.argon2
# [[access.users]]
# username = "operator"
# role = "admin"
# password_hash_file = "/protected/path/admin.argon2"

[[printers]]
name = "demo"
display_name = "Ferriprint Demonstrator"
service_name = "Ferriprint Demonstrator"
location = "Local test receiver: never a physical printer"
ppd = "../tests/fixtures/native.ppd"
upstream_uri = "ipp://127.0.0.1:18631/printers/receiver"
upstream_username = "ferriprint"
# Optional explicit Linux Avahi scope for a real TLS FQDN (not this loopback demo):
# [discovery]
# interface = "eth0"
# protocol = "ipv4"
# Native queue reports are not necessarily fresh physical sensor readings:
# [printers.telemetry]
# uri = "ipps://print.example.test:631/printers/existing"
# source = "native-cups-ipp"
