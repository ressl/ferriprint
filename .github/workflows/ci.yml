name: CI

on:
  push:
    branches: [main, public-development]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: rust:1.99.1-bookworm@sha256:8bf7188ae46ad73b801c8d405eedc13ce63a7852b562885743a56890723549a8
          - runner: ubuntu-24.04-arm
            image: rust:1.99.1-bookworm@sha256:32f7944ed00949c44d3944a0a852b3e5ea862a610a38b43ac92a33aa87256b75
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust only this container's owned checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pinned toolchain components
        run: |
          rustup component add rustfmt clippy
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends python3-jsonschema
      - name: Format and strict lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Behavioral and security tests
        run: cargo test --locked --all-targets --all-features
      - name: Native Linux root migration ownership boundary
        run: |
          test "$(id -u)" -eq 0
          cargo test --locked --test migration root_migration_keeps_bootstrap_root_owned_service_readable_and_not_service_writable -- --ignored
      - name: Dependency inventory and notice proof
        run: |
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          python3 scripts/release-metadata.py --metadata /tmp/metadata.json --commit "$GITHUB_SHA" --source-date-epoch "$(git show -s --format=%ct "$GITHUB_SHA")" --notices THIRD_PARTY_NOTICES.md --check-notices --sbom /tmp/ferriprint.spdx.json
          python3 scripts/verify-release-metadata.py "$GITHUB_SHA" /tmp/ferriprint.spdx.json
      - name: Script syntax and exact embedded source proof
        run: |
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
          cargo build --locked --release --bin ferriprint
          python3 scripts/extract-source.py target/release/ferriprint /tmp/ferriprint-source.tar.gz
          python3 scripts/verify-source.py "$GITHUB_SHA" /tmp/ferriprint-source.tar.gz
  msrv:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: rust:1.88.0-bookworm@sha256:4727898c104ecd2e22d780925832502faee9fe4e70581b8572af081370b315a0
          - runner: ubuntu-24.04-arm
            image: rust:1.88.0-bookworm@sha256:8aa70d1416cf5b1cff4b95ec6c57f1c5e4e649a3b53d616a26695cda6fbb46bc
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Trust only this container's owned checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build library and executable with the declared minimum Rust
        run: cargo build --locked --all-features --lib --bin ferriprint
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history without exposing findings
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --mount "type=bind,src=$PWD,dst=/repo,readonly" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact --no-banner
